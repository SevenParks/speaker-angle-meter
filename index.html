<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームシアター角度計</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    background:#111;
    color:#fff;
    margin:20px;
}

.value{
    font-size:3rem;
    margin:10px;
    color:white;
    transition:color 0.2s;
}

.ok{
    color:#00ff55;
}

.near{
    color:#ffd700;
}

.debug{
    font-size:1.2rem;
    color:#aaa;
    margin-bottom:10px;
}

input{
    font-size:1.2rem;
    width:100px;
    text-align:center;
    margin:5px;
}

button{
    font-size:1.2rem;
    padding:10px 20px;
    margin:10px;
}
</style>
</head>

<body>

<h1>ホームシアター角度計</h1>

<button id="enableBtn">センサー有効化</button>
<br>
<button id="zeroBtn">正面を基準登録</button>

<hr>

<h3>目標トーイン角</h3>
<input id="targetYaw" type="number" step="0.1" placeholder="24.0">

<h3>目標ピッチ角</h3>
<input id="targetPitch" type="number" step="0.1" placeholder="33.0">

<hr>

<h2>トーイン角</h2>
<div id="yaw" class="value">0.0°</div>

<h2>ピッチ角</h2>
<div id="pitch" class="value">0.0°</div>

<h2>ロール角</h2>
<div id="roll" class="value">0.0°</div>


<h3>デバッグ（使用中の値）</h3>
<div id="yawRaw" class="debug">0.00°</div>

<h3>デバッグ（event.alpha）</h3>
<div id="alphaRaw" class="debug">0.00°</div>

<h3>デバッグ（webkitCompassHeading）</h3>
<div id="compassRaw" class="debug">0.00°</div>


<script>

// ゼロ点補正値
let yawOffset = 0;

// 表示用フィルター後角度
let yawFiltered = 0;

// Alpha基準角度
let alphaReference = null;

/*
 * ±0.3°以内 → 緑
 * ±0.9°以内 → 黄
 */
const GREEN_TOLERANCE = 0.3;
const YELLOW_TOLERANCE = 0.9;

/*
 * 平滑化係数 0.85
 * 大きいほど安定
 * 小さいほど追従性重視
 */
const FILTER_FACTOR = 0.25;

/*
 * ドリフト補正用コンパス比率
 *
 * 0.00 = Alphaのみ
 * 0.02 = 2%だけCompass使用
 * 0.05 = 5%だけCompass使用
 */
const COMPASS_BLEND = 0.02;

function normalize(angle){

    while(angle > 180) angle -= 360;
    while(angle < -180) angle += 360;

    return angle;
}

function setColor(element,value,target){

    element.classList.remove("ok");
    element.classList.remove("near");

    if(isNaN(target)){
        return;
    }

    const error = Math.abs(value - target);

    if(error <= GREEN_TOLERANCE){
        element.classList.add("ok");
    }
    else if(error <= YELLOW_TOLERANCE){
        element.classList.add("near");
    }
}

async function enableSensors(){

    if(typeof DeviceOrientationEvent.requestPermission === 'function'){

        const result =
            await DeviceOrientationEvent.requestPermission();

        if(result !== 'granted'){
            alert('許可されませんでした');
            return;
        }
    }

    window.addEventListener(
        'deviceorientation',
        updateOrientation
    );
}

function updateOrientation(event){

    const alpha = event.alpha;
    const compass = event.webkitCompassHeading;

    if(alpha == null){
        return;
    }

    const pitch = event.beta ?? 0;
    const roll = event.gamma ?? 0;

    if(alphaReference === null){
        alphaReference = alpha;
    }

    /*
     * event.alpha主体
     */
    let yaw =
        normalize(alpha - alphaReference);

    /*
     * Compassを少量だけ混ぜる
     * ドリフト抑制目的
     */
    if(compass !== undefined){

        const compassRelative =
            normalize(compass - alphaReference);

        yaw =
            yaw * (1 - COMPASS_BLEND) +
            compassRelative * COMPASS_BLEND;
    }

    let relativeYaw =
        normalize(yaw - yawOffset);

    /*
     * 平滑化
     */
    yawFiltered =
        yawFiltered * FILTER_FACTOR +
        relativeYaw * (1 - FILTER_FACTOR);

    document.getElementById("yaw")
        .innerText =
        yawFiltered.toFixed(2) + "°";

    document.getElementById("pitch")
        .innerText =
        pitch.toFixed(1) + "°";

    document.getElementById("roll")
        .innerText =
        roll.toFixed(1) + "°";



    document.getElementById("yawRaw")
        .innerText =
        yaw.toFixed(2) + "°";

    document.getElementById("alphaRaw")
        .innerText =
        alpha.toFixed(2) + "°";

    document.getElementById("compassRaw")
        .innerText =
        (compass ?? 0).toFixed(2) + "°";


    const targetYaw =
        parseFloat(
            document.getElementById("targetYaw").value
        );

    const targetPitch =
        parseFloat(
            document.getElementById("targetPitch").value
        );

    setColor(
        document.getElementById("yaw"),
        yawFiltered,
        targetYaw
    );

    setColor(
        document.getElementById("pitch"),
        pitch,
        targetPitch
    );
}

document.getElementById("enableBtn")
    .addEventListener(
        "click",
        enableSensors
    );

document.getElementById("zeroBtn")
    .addEventListener(
        "click",
        () => {

            yawOffset += yawFiltered;

        }
    );

</script>

</body>
</html>
