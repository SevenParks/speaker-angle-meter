<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームシアター角度計</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    background:#111;
    color:#fff;
    margin:20px;
}

.value{
    font-size:3rem;
    margin:10px;
    color:white;
    transition:color .2s;
}

.ok{
    color:#00ff55;
}

.near{
    color:#ffd700;
}

.debug{
    color:#aaa;
    font-size:1rem;
    margin:4px;
}

input,select{
    font-size:1.1rem;
    width:140px;
    text-align:center;
    margin:5px;
}

button{
    font-size:1.1rem;
    padding:10px 20px;
    margin:10px;
}
</style>
</head>

<body>

<h1>ホームシアター角度計</h1>

<button id="enableBtn">センサー有効化</button>
<br>
<button id="zeroBtn">正面を基準登録</button>

<hr>

<h3>トーイン計測方式</h3>

<select id="yawMode">
    <option value="alpha">Alpha</option>
    <option value="scaled" selected>Alpha+補正</option>
    <option value="fusion">Fusion</option>
    <option value="compass">Compass</option>
</select>

<hr>

<h3>目標トーイン角</h3>
<input id="targetYaw" type="number" step="0.1" placeholder="24">

<h3>目標ピッチ角</h3>
<input id="targetPitch" type="number" step="0.1" placeholder="33">

<hr>

<h2>トーイン角</h2>
<div id="yaw" class="value">0.00°</div>

<h2>ピッチ角</h2>
<div id="pitch" class="value">0.0°</div>

<h2>ロール角</h2>
<div id="roll" class="value">0.0°</div>

<hr>

<h3>デバッグ</h3>

<div class="debug">
選択方式 : <span id="modeDebug"></span>
</div>

<div class="debug">
alpha : <span id="alphaRaw">0</span>
</div>

<div class="debug">
compass : <span id="compassRaw">0</span>
</div>

<div class="debug">
内部Yaw : <span id="yawRaw">0</span>
</div>

<script>

/* 緑判定 */
const GREEN_TOLERANCE = 0.2;

/* 黄判定 */
const YELLOW_TOLERANCE = 0.5;

/* 平滑化係数 */
const FILTER_FACTOR = 0.85;

/*
90°回転で87.5°だった場合

90 / 87.5 = 1.02857
*/
const YAW_SCALE = 1.02857;

/* Fusion時のCompass混合率 */
const COMPASS_BLEND = 0.02;

let yawOffset = 0;
let yawFiltered = 0;
let alphaReference = null;
let compassReference = null;

function normalize(angle){

    while(angle > 180) angle -= 360;
    while(angle < -180) angle += 360;

    return angle;
}

function setColor(element,value,target){

    element.classList.remove("ok");
    element.classList.remove("near");

    if(isNaN(target)) return;

    const error =
        Math.abs(value-target);

    if(error <= GREEN_TOLERANCE){

        element.classList.add("ok");

    }else if(error <= YELLOW_TOLERANCE){

        element.classList.add("near");
    }
}

async function enableSensors(){

    if(
        typeof DeviceOrientationEvent
        .requestPermission ===
        'function'
    ){

        const result =
        await DeviceOrientationEvent
        .requestPermission();

        if(result !== 'granted'){

            alert('許可されませんでした');
            return;
        }
    }

    window.addEventListener(
        'deviceorientation',
        updateOrientation
    );
}

function updateOrientation(event){

    const alpha = event.alpha;
    const compass = event.webkitCompassHeading;

    if(alpha == null) return;

    if(alphaReference === null){

        alphaReference = alpha;
    }

    if(
        compassReference === null &&
        compass !== undefined
    ){

        compassReference = compass;
    }

    const pitch =
        event.beta ?? 0;

    const roll =
        event.gamma ?? 0;

    const mode =
        document
        .getElementById("yawMode")
        .value;

    const alphaRelative =
        normalize(
            alpha -
            alphaReference
        );

    let compassRelative = 0;

    if(
        compass !== undefined &&
        compassReference !== null
    ){

        compassRelative =
            normalize(
                compass -
                compassReference
            );
    }

    let yaw = alphaRelative;

    switch(mode){

        case "alpha":

            yaw =
                alphaRelative;

            break;

        case "scaled":

            yaw =
                alphaRelative *
                YAW_SCALE;

            break;

        case "compass":

            yaw =
                compassRelative;

            break;

        case "fusion":

            yaw =
                alphaRelative *
                (1-COMPASS_BLEND)
                +
                compassRelative *
                COMPASS_BLEND;

            break;
    }

    yaw =
        normalize(
            yaw -
            yawOffset
        );

    yawFiltered =
        yawFiltered *
        FILTER_FACTOR
        +
        yaw *
        (1-FILTER_FACTOR);

    document
        .getElementById("yaw")
        .innerText =
        yawFiltered.toFixed(2)+"°";

    document
        .getElementById("pitch")
        .innerText =
        pitch.toFixed(1)+"°";

    document
        .getElementById("roll")
        .innerText =
        roll.toFixed(1)+"°";

    document
        .getElementById("modeDebug")
        .innerText =
        mode;

    document
        .getElementById("alphaRaw")
        .innerText =
        alphaRelative.toFixed(2);

    document
        .getElementById("compassRaw")
        .innerText =
        compassRelative.toFixed(2);

    document
        .getElementById("yawRaw")
        .innerText =
        yaw.toFixed(2);

    const targetYaw =
        parseFloat(
            document
            .getElementById("targetYaw")
            .value
        );

    const targetPitch =
        parseFloat(
            document
            .getElementById("targetPitch")
            .value
        );

    setColor(
        document.getElementById("yaw"),
        yawFiltered,
        targetYaw
    );

    setColor(
        document.getElementById("pitch"),
        pitch,
        targetPitch
    );
}

document
.getElementById("enableBtn")
.addEventListener(
    "click",
    enableSensors
);

document
.getElementById("zeroBtn")
.addEventListener(
    "click",
    ()=>{

        yawOffset +=
            yawFiltered;
    }
);

</script>

</body>
</html>
